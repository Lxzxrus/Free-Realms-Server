# The game's streamed assets (/srv/assets, made by evergrove-asset-mirror.py), for /etc/nginx/sites-enabled/.
#
# nginx rather than Caddy: the client puts asset names into its request line unencoded, and 703 of them have spaces
# ("GET /assets/513/Bear Vinegolem.gfx?2613667368 HTTP/1.1"). Go's HTTP server, so Caddy, answers that with 400;
# nginx, like the Cloudflare front of OSFR's asset server, reads the space as part of the path. Plain HTTP, because
# the client has no HTTPS. Read-only files, nothing else: no directory listings, no other paths, GET and HEAD only.

limit_conn_zone $binary_remote_addr zone=evergrove_assets:10m;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;

    root /srv;
    autoindex off;
    access_log off;

    # A client fetches a few assets at a time; this is far above that and far below a flood.
    limit_conn evergrove_assets 32;

    location /assets/ {
        limit_except GET HEAD { deny all; }

        # Half-written files of a copy in progress.
        location ~ \.part$ { return 404; }

        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        return 404;
    }
}
