services:
  sanctuary.mysql:
    # MariaDB 11.4 is a long-term release, supported until May 2029. When the image's version is newer than the data's,
    # the entrypoint runs mariadb-upgrade on start (MARIADB_AUTO_UPGRADE), after backing up the system tables. A
    # database upgraded this way can't go back to an older version: restore a backup into a fresh volume instead.
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD, see .env.example}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE, see .env.example}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER, see .env.example}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD, see .env.example}
    # No ports: the database is reachable only by the servers, over the Compose network. Never publish 3306.
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  sanctuary.webapi:
    image: ${DOCKER_REGISTRY-}sanctuary-webapi
    build:
      context: ../
      dockerfile: Docker/Sanctuary.WebAPI.dockerfile
    restart: unless-stopped
    ports:
      # Loopback only: put a TLS proxy such as Caddy in front (docs/webapi.md). Never expose plain HTTP.
      - "127.0.0.1:20040:20040"
    volumes: &common-volumes
      - ../../logs:/app/Logs
      - ../../src/Resources:/app/Resources
      - ../../src/Scripts:/app/Scripts
    environment: &common-env
      Database__Provider: "0" # MySql (MariaDB uses the same provider)
      Database__VersionString: 11.4.13-mariadb
      Database__ConnectionString: Server=sanctuary.mysql;Port=3306;Database=${MYSQL_DATABASE:?Set MYSQL_DATABASE, see .env.example};User=${MYSQL_USER:?Set MYSQL_USER, see .env.example};Password=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD, see .env.example};
      Server__LoginGatewayAddress: sanctuary.login:20041
      Server__ServerAddress: localhost:20260 # replace 'localhost' with your public IP or domain name
      Urls: http://0.0.0.0:20040
      WebAPI__StatusLoginServer: sanctuary.login:20042 # what /status asks (only WebAPI reads it)
      WebAPI__TrustedProxies__0: 172.16.0.0/12 # Docker's bridge gateway, which loopback connections arrive from
    depends_on:
      sanctuary.mysql:
        condition: service_healthy

  sanctuary.gateway:
    image: ${DOCKER_REGISTRY-}sanctuary-gateway
    build:
      context: ../
      dockerfile: Docker/Sanctuary.Gateway.dockerfile
    restart: unless-stopped
    ports:
      - "20260:20260/udp"
    volumes: *common-volumes
    environment:
      <<: *common-env
      Server__LoginGatewayChallenge: ${LOGIN_GATEWAY_CHALLENGE:?Set LOGIN_GATEWAY_CHALLENGE, see .env.example}
    depends_on:
      sanctuary.mysql:
        condition: service_healthy

  sanctuary.login:
    image: ${DOCKER_REGISTRY-}sanctuary-login
    build:
      context: ../
      dockerfile: Docker/Sanctuary.Login.dockerfile
    restart: unless-stopped
    # The LoginGateway port (20041) is reachable only by the Gateway, over the Compose network. Never publish it.
    ports:
      - "20042:20042/udp"
    volumes: *common-volumes
    environment:
      <<: *common-env
      Server__LoginGatewayChallenge: ${LOGIN_GATEWAY_CHALLENGE:?Set LOGIN_GATEWAY_CHALLENGE, see .env.example}
      Server__LoginGatewayBindAddress: 0.0.0.0 # inside the container, so the Gateway's container can reach it
    depends_on:
      sanctuary.mysql:
        condition: service_healthy

volumes:
  db: